name: 'PHPCS'
on:
  workflow_call:
    secrets:
      access-token:
        description: 'GitHub Access Token'
        required: true
    inputs:
      ref:
        description: 'Git Commit Ref (branch, tag, or hash)'
        required: true
        type: string
      php_version:
        description: 'PHP Version'
        required: false
        type: string
        default: '7.4'
      change_permissions:
        description: 'Whether to change file permissions to root'
        required: false
        type: boolean
        default: true
jobs:
  phpcs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      # ------------------------------------------------------------------------------
      # Get changed files — runs right after checkout so we can skip remaining
      # steps entirely when no PHP files changed
      # ------------------------------------------------------------------------------
      - name: Get list of changed files
        id: files
        run: |
            CHANGED_FILES=$(git diff --name-only --diff-filter=AM ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }} -- . ':!tests' | grep '\.php$' || true)                                                                                                                       
                                                                                                                                                                                                                                                                                                                    
            {                                                                                                                                                                                                                                                                                                       
              echo 'CHANGED_FILES<<EOF'                                                                                                                                                                                                                                                                             
              echo "$CHANGED_FILES"                                                                                                                                                                                                                                                                                 
              echo EOF                                                                                                                                                                                                                                                                                              
            } >> $GITHUB_ENV                                                                                                                                                                                                                                                                                        
                                                                                                                                                                                                                                                                                                                    
            if [ -n "$CHANGED_FILES" ]; then                                                                                                                                                                                                                                                                        
              echo "has_php_files=true" >> $GITHUB_OUTPUT                                                                                                                                                                                                                                                           
            else                                                                                                                                                                                                                                                                                                    
              echo "No PHP files changed, skipping phpcs"                                                                                                                                                                                                                                                           
              echo "has_php_files=false" >> $GITHUB_OUTPUT                                                                                                                                                                                                                                                          
            fi

      - uses: shivammathur/setup-php@v2
        if: steps.files.outputs.has_php_files == 'true'
        with:
          php-version: ${{ inputs.php_version }}

      - uses: ramsey/composer-install@v3
        if: steps.files.outputs.has_php_files == 'true'
        with:
          composer-options: "--ignore-platform-reqs"

      - name: "Give permissions"
        if: ${{ inputs.change_permissions }}
        run: |
          sudo chown -R root:root $GITHUB_WORKSPACE

      # ------------------------------------------------------------------------------
      # PHPCS
      # ------------------------------------------------------------------------------
      - uses: reviewdog/action-setup@v1
        if: steps.files.outputs.has_php_files == 'true'
        with:
          reviewdog_version: latest # Optional. [latest,nightly,v.X.Y.Z]
      - name: Run reviewdog
        if: steps.files.outputs.has_php_files == 'true'
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.access-token }}
        run: |
          # Read changed files into array - preserves filenames with spaces
          mapfile -t FILES <<< "${{ env.CHANGED_FILES }}"

          # Run phpcs over the changed files, capturing its checkstyle report.
          # IMPORTANT: phpcs's own exit code reflects EVERY issue in the whole
          # file, including pre-existing ones on lines this PR never touched, so
          # it must NOT gate the job - reviewdog does that below. Wrapping in
          # `set +e` keeps `bash -e` from killing the step before reviewdog runs.
          set +e
          CHECKSTYLE_REPORT=$(vendor/bin/phpcs --report=checkstyle -q "${FILES[@]}")
          PHPCS_EXIT_CODE=$?
          set -e

          # phpcs prints a <checkstyle> document even when the code is clean, so
          # empty output combined with a non-zero code means phpcs itself failed
          # to run (bad standard, parse error, ...). That is a real failure.
          if [ -z "$CHECKSTYLE_REPORT" ] && [ "$PHPCS_EXIT_CODE" -ne 0 ]; then
            echo "phpcs failed to run (exit code $PHPCS_EXIT_CODE)"
            exit "$PHPCS_EXIT_CODE"
          fi

          # Feed the report to reviewdog. -filter-mode=added limits reporting to
          # lines changed by this PR and -fail-level=any makes reviewdog exit 1
          # only when it actually reports such an issue. The job result is thus
          # driven by NEW violations, not phpcs's whole-file exit code.
          REVIEWDOG_EXIT_CODE=0
          echo "$CHECKSTYLE_REPORT" \
            | reviewdog -f=checkstyle -name="phpcs" -filter-mode="added" -fail-level=any -reporter=github-pr-review \
            || REVIEWDOG_EXIT_CODE=$?

          # 0 when the PR introduced no new violations, 1 when it did (inline
          # comments have already been posted by reviewdog).
          exit "$REVIEWDOG_EXIT_CODE"
