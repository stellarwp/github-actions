name: 'PHPCS'
on:
  workflow_call:
    secrets:
      access-token:
        description: 'GitHub Access Token'
        required: true
    inputs:
      ref:
        description: 'Git Commit Ref (branch, tag, or hash)'
        required: true
        type: string
      php_version:
        description: 'PHP Version'
        required: false
        type: string
        default: '7.4'
      change_permissions:
        description: 'Whether to change file permissions to root'
        required: false
        type: boolean
        default: true
jobs:
  phpcs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      # ------------------------------------------------------------------------------
      # Get changed files — runs right after checkout so we can skip remaining
      # steps entirely when no PHP files changed
      # ------------------------------------------------------------------------------
      - name: Get list of changed files
        id: files
        run: |
          {
            echo 'CHANGED_FILES<<EOF'
            git diff --name-only --diff-filter=AM ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }} -- . ':!tests' | grep '\.php$' || true
            echo EOF
          } >> $GITHUB_ENV

          if git diff --name-only --diff-filter=AM ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }} -- . ':!tests' | grep -q '\.php$'; then
            echo "has_php_files=true" >> $GITHUB_OUTPUT
          else
            echo "No PHP files changed, skipping phpcs"
            echo "has_php_files=false" >> $GITHUB_OUTPUT
          fi

      - uses: shivammathur/setup-php@v2
        if: steps.files.outputs.has_php_files == 'true'
        with:
          php-version: ${{ inputs.php_version }}

      - uses: ramsey/composer-install@v3
        if: steps.files.outputs.has_php_files == 'true'
        with:
          composer-options: "--ignore-platform-reqs"

      - name: "Give permissions"
        if: ${{ inputs.change_permissions }}
        run: |
          sudo chown -R root:root $GITHUB_WORKSPACE

      # ------------------------------------------------------------------------------
      # PHPCS
      # ------------------------------------------------------------------------------
      - uses: reviewdog/action-setup@v1
        if: steps.files.outputs.has_php_files == 'true'
        with:
          reviewdog_version: latest # Optional. [latest,nightly,v.X.Y.Z]
      - name: Run reviewdog
        if: steps.files.outputs.has_php_files == 'true'
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.access-token }}
        run: |
          # Run phpcs — printf + xargs -d '\n' keeps filenames with spaces intact
          JSON_REPORT=$(printf '%s\n' "${{ env.CHANGED_FILES }}" | xargs -d '\n' vendor/bin/phpcs --report=json -q)
          PHPCS_EXIT_CODE=$?

          # Check if phpcs produced a JSON report
          if [ -z "$JSON_REPORT" ]; then
            echo "No JSON report generated by phpcs"
            exit $PHPCS_EXIT_CODE
          fi

          # Validate the JSON
          if ! echo "$JSON_REPORT" | jq empty; then
            echo "Invalid JSON"
            exit 1
          fi

          # Process JSON and run reviewdog
          echo "$JSON_REPORT" | jq -r ' .files | to_entries[] | .key as $path | .value.messages[] as $msg | "\($path):\($msg.line):\($msg.column):`\($msg.source)`<br>\($msg.message)" ' | reviewdog -efm="%f:%l:%c:%m" -name="phpcs" -filter-mode="added" -fail-level=any -reporter=github-pr-review

          # Exit with the original phpcs exit code
          exit $PHPCS_EXIT_CODE
